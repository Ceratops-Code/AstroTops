version: 2
updates:
- package-ecosystem: uv
  target-branch: release/local
  directory: /scripts
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  target-branch: release/local
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: npm
  target-branch: release/local
  directory: /scripts
  schedule:
    interval: weekly
- package-ecosystem: gradle
  target-branch: release/local
  # The settings file includes both the board and Godot subprojects.
  directory: /addons/bobo_board/native
  schedule:
    interval: weekly
