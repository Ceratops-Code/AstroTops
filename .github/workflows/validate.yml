name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up Java for Android
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Linux speech synthesis
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libspeechd2 speech-dispatcher speech-dispatcher-espeak-ng
          speech-dispatcher --spawn
          spd-say --list-synthesis-voices
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: "false"
          include-templates: "false"
      - name: Install npm validation dependencies
        run: npm --prefix scripts ci
      - name: Validate and test through SDLC
        uses: Ceratops-Code/Ceratops-AI-Agents-Kit/skills/ceratops-repo-lifecycle/scripts@fd2616cac03ef727a0ea96dc778ad15295d05b90 # revision fd2616cac03e
        with:
          repo-root: ${{ github.workspace }}
          evidence-file: ${{ runner.temp }}/repository-validation.log

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          path: ${{ runner.temp }}/repository-validation.log
