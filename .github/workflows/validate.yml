name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate-repository:
    name: validate-repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up Godot
        uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2
        with:
          version: 4.7.2
          use-dotnet: "false"
          include-templates: "false"
      - name: Install npm validation dependencies
        run: npm --prefix scripts ci
      - name: Validate and test through SDLC
        uses: Ceratops-Code/Ceratops-AI-Agents-Kit/skills/ceratops-repo-lifecycle/scripts@8b66565ee42edb5d2840bf895e2a79b739d347d0
        with:
          repo-root: ${{ github.workspace }}
          evidence-file: ${{ runner.temp }}/repository-validation.log

      - name: Upload validation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          name: repository-validation-evidence
          path: ${{ runner.temp }}/repository-validation.log
