version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    adb:
      executable: adb
      platforms:
        - windows
    godot:
      executable: godot
      version: 4.7.2
    powershell:
      executable: powershell.exe
      platforms:
        - windows
    uv:
      executable: uv
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
    validate:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
    test:
      requires:
        capabilities:
          - godot
          - uv
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/run-tests.py
            - --scope
            - repository
deliverables:
  packages:
    astrotops-android-apk:
      source: .
      prerequisites: []
      artifact:
        type: android-apk
        output-directory: .build/artifacts/android
        filename-pattern: AstroTops.apk
      actions:
        build:
          requires:
            capabilities:
              - godot
              - powershell
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - powershell.exe
                - -NoProfile
                - -Command
                - New-Item -ItemType Directory -Force -Path '.build/artifacts/android' | Out-Null
            - run:
                - godot
                - --headless
                - --path
                - .
                - --export-debug
                - Android
                - .build/artifacts/android/AstroTops.apk
  apps:
    astrotops:
      source: .
      manifest: export_presets.cfg
      prerequisites:
        - astrotops-android-apk
      actions:
        validate:
          requires:
            capabilities:
              - godot
          steps:
            - run:
                - godot
                - --headless
                - --editor
                - --path
                - .
                - --quit
        test:
          requires:
            capabilities: []
          no-op: Repository tests own the grouped gameplay and rendered-app qualification.
        install:
          requires:
            capabilities:
              - adb
              - uv
          parameters:
            - adb_executable
            - device
            - source_tag
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/run-tests.py
                - --verify-delivery
                - --source-tag
                - "{source_tag}"
                - --artifact
                - .build/artifacts/android/AstroTops.apk
            - run:
                - "{adb_executable}"
                - connect
                - "{device}"
            - run:
                - "{adb_executable}"
                - -s
                - "{device}"
                - install
                - -r
                - .build/artifacts/android/AstroTops.apk
            - run:
                - "{adb_executable}"
                - -s
                - "{device}"
                - shell
                - am
                - start
                - -W
                - -n
                - com.ceratopscode.astrotops/com.godot.game.GodotAppLauncher
            - run:
                - "{adb_executable}"
                - -s
                - "{device}"
                - shell
                - pm
                - path
                - com.ceratopscode.astrotops
