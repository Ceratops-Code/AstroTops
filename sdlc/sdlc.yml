version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    adb:
      executable: adb
      platforms:
        - windows
    uv:
      executable: uv
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
        - run:
            - uv
            - run
            - --locked
            - scripts/run-tests.py
            - --prepare-godot
    validate:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/validate-repository.py
    test:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --locked
            - scripts/run-tests.py
            - --scope
            - repository
deliverables:
  packages:
    astrotops-android-apk:
      source: .
      prerequisites: []
      artifact:
        type: android-apk
        output-directory: .build/artifacts/android
        filename-pattern: AstroTops.apk
      actions:
        build:
          requires:
            capabilities:
              - uv
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/run-tests.py
                - --export-debug
                - .build/artifacts/android/AstroTops.apk
            - run:
                - uv
                - run
                - --locked
                - scripts/result_records.py
                - build-result
                - --artifact
                - .build/artifacts/android/AstroTops.apk
                - --type
                - android-apk
  apps:
    astrotops:
      source: .
      manifest: export_presets.cfg
      prerequisites:
        - astrotops-android-apk
      actions:
        validate:
          requires:
            capabilities:
              - uv
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/run-tests.py
                - --validate-project
        test:
          requires:
            capabilities: []
          no-op: Repository tests own the grouped gameplay and rendered-app qualification.
        install:
          requires:
            capabilities:
              - adb
              - uv
          parameters:
            - adb_executable
            - device
            - source_tag
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --locked
                - scripts/run-tests.py
                - --verify-delivery
                - --source-tag
                - "{source_tag}"
                - --artifact
                - .build/artifacts/android/AstroTops.apk
            - run:
                - uv
                - run
                - --locked
                - scripts/result_records.py
                - android-deploy
                - --adb-executable
                - "{adb_executable}"
                - --device
                - "{device}"
                - --package
                - com.ceratopscode.astrotops
                - --activity
                - com.ceratopscode.astrotops/com.godot.game.GodotAppLauncher
                - --artifact
                - .build/artifacts/android/AstroTops.apk
                - --type
                - android-apk
