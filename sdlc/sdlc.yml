version: 4
kind: ceratops-sdlc
repository:
  capabilities:
    adb:
      executable: adb
      platforms:
        - windows
    android-sdk:
      executable: adb
    jdk:
      executable: java
    uv:
      executable: uv
  actions:
    bootstrap:
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - sync
            - --project
            - scripts
            - --locked
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - scripts/run-tests.py
            - --prepare-godot
    validate:
      check-results:
        product-inputs:
          - project.godot
          - export_presets.cfg
          - main.tscn
          - assets/**
          - addons/bobo_board/**
        check-inputs:
          - "*.md"
          - .gitignore
          - THIRD_PARTY_NOTICES.txt
          - scripts/**
          - docs/**
          - sdlc/sdlc.yml
          - .github/**
        dependencies:
          - scripts/uv.lock
          - scripts/package-lock.json
        environment:
          - JAVA_HOME
          - ANDROID_HOME
          - ANDROID_SDK_ROOT
          - GITHUB_EVENT_NAME
          - GITHUB_EVENT_PATH
        tools:
          - python
          - git
          - npm
          - uv
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/validate-repository.py
            - --no-record
    test:
      check-results:
        product-inputs:
          - project.godot
          - export_presets.cfg
          - main.tscn
          - assets/**
          - scripts/main.gd
          - scripts/audio_controller.gd
          - scripts/space_target.gd
          - scripts/player_ship.gd
          - scripts/planet.gd
          - scripts/traxy.gd
          - scripts/meteor.gd
          - scripts/godot_toolchain.py
          - scripts/build_board_module.py
          - addons/bobo_board/*.gd
          - addons/bobo_board/plugin.cfg
          - addons/bobo_board/native/*.kts
          - addons/bobo_board/native/*.properties
          - addons/bobo_board/native/gradlew*
          - addons/bobo_board/native/gradle/**
          - addons/bobo_board/native/board/build.gradle.kts
          - addons/bobo_board/native/godot/build.gradle.kts
          - addons/bobo_board/native/board/src/main/**
          - addons/bobo_board/native/godot/src/main/**
        check-inputs:
          - scripts/run-tests.py
          - scripts/regression_tests.gd
          - scripts/result_records.py
          - docs/feature-acceptance.json
          - sdlc/sdlc.yml
          - addons/bobo_board/native/board/src/test/**
        dependencies:
          - scripts/uv.lock
          - scripts/package-lock.json
        environment:
          - JAVA_HOME
          - ANDROID_HOME
          - ANDROID_SDK_ROOT
          - JAVA_TOOL_OPTIONS
          - GRADLE_OPTS
          - DISPLAY
          - LANG
          - LC_ALL
          - TZ
        tools:
          - python
          - git
          - java
          - adb
          - uv
      requires:
        capabilities:
          - uv
      steps:
        - run:
            - uv
            - run
            - --project
            - scripts
            - --locked
            - python
            - scripts/run-tests.py
            - --no-record
            - --scope
            - repository
deliverables:
  packages:
    astrotops-android-apk:
      source: .
      prerequisites: []
      artifact:
        type: android-apk
        output-directory: .build/artifacts/android
        filename-pattern: AstroTops.apk
      actions:
        build:
          requires:
            capabilities:
              - android-sdk
              - jdk
              - uv
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/run-tests.py
                - --export-debug
                - .build/artifacts/android/AstroTops.apk
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/result_records.py
                - build-result
                - --artifact
                - .build/artifacts/android/AstroTops.apk
                - --type
                - android-apk
  apps:
    astrotops:
      source: .
      manifest: export_presets.cfg
      prerequisites:
        - astrotops-android-apk
      actions:
        validate:
          requires:
            capabilities:
              - android-sdk
              - jdk
              - uv
          validation-capabilities:
            - android-build
            - android-lint
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/run-tests.py
                - --validate-android-build
        test:
          requires:
            capabilities: []
          no-op: Repository tests own the grouped gameplay and rendered-app qualification.
        install:
          requires:
            capabilities:
              - adb
              - uv
          parameters:
            - adb_executable
            - device
            - source_tag
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/run-tests.py
                - --verify-delivery
                - --source-tag
                - "{source_tag}"
                - --artifact
                - .build/artifacts/android/AstroTops.apk
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/result_records.py
                - android-deploy
                - --adb-executable
                - "{adb_executable}"
                - --device
                - "{device}"
                - --package
                - com.ceratopscode.astrotops
                - --activity
                - com.ceratopscode.astrotops/com.godot.game.GodotAppLauncher
                - --artifact
                - .build/artifacts/android/AstroTops.apk
                - --type
                - android-apk
