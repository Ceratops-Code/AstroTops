version: 5
kind: ceratops-sdlc
repository:
  tools:
    adb:
      executable: adb
      platforms:
        - windows
    android-sdk:
      executable: adb
    jdk:
      executable: java
    uv:
      executable: uv
    python:
      executable: python
      version-from:
        file: scripts/pyproject.toml
        key: project.requires-python
    node:
      executable: node
      version-from:
        file: scripts/package.json
        key: engines.node
    git:
      executable: git
    npm:
      executable: npm
  actions:
    bootstrap:
      requires:
        tools:
          - uv
          - node
          - npm
      steps:
        - run: [uv, sync, --project, scripts, --locked]
        - run: [uv, run, --project, scripts, --locked, scripts/run-tests.py, --prepare-godot]
        - run: [npm, ci, --prefix, scripts]
    pre-build-checks:
      check-groups:
        repository-contract:
          requires:
            tools:
              - uv
              - python
              - git
          validation-tools:
            - repository-contract
          check-results:
            result-owner: operation
            product-inputs:
              - export_presets.cfg
              - docs/feature-acceptance.json
              - .markdownlint.json
              - .ruff.toml
              - eslint.config.js
              - mypy.ini
              - package-lock.json
              - package.json
              - project.toml
              - pyproject.toml
              - ruff.toml
              - uv.lock
              - .test-results/tests.json
              - .test-results/validation.json
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - scripts/check-repository-contract.py
              - .gitignore
              - .build/README.md
              - scripts/regression_tests.gd
              - scripts/result_records.py
              - scripts/run-tests.py
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
            tools:
              - uv
              - python
              - git
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/check-repository-contract.py]
        npm-markdown-lint:
          requires:
            tools:
              - node
              - npm
          validation-tools:
            - npm-markdown-lint
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.md'
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/package.json
              - scripts/.markdownlint.json
            dependencies:
              - scripts/package-lock.json
            tools:
              - node
              - npm
          steps:
            - run: [npm, --prefix, scripts, run, lint:markdown]
        ruff:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - ruff
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.py'
              - '**/*.pyi'
              - '**/*.ipynb'
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, ruff, check, ., --config, scripts/pyproject.toml]
        mypy:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - mypy
          check-results:
            result-owner: operation
            product-inputs:
              - '**/*.py'
              - '**/*.pyi'
              - '**/*.ipynb'
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - .gitignore
              - '**/.gitignore'
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - MYPYPATH
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, -m, mypy, --config-file, scripts/pyproject.toml]
        actionlint:
          requires:
            tools:
              - uv
              - python
          validation-tools:
            - actionlint
          check-results:
            result-owner: operation
            product-inputs:
              - .github/workflows/*.yml
              - .github/workflows/*.yaml
              - .github/actions/**
            check-inputs:
              - sdlc/sdlc.yml
              - scripts/pyproject.toml
              - scripts/run-actionlint.py
              - .github/actionlint.yaml
              - .github/actionlint.yml
            dependencies:
              - scripts/uv.lock
            environment:
              - UV_OFFLINE
              - UV_PYTHON
              - UV_PYTHON_PREFERENCE
              - GITHUB_EVENT_NAME
              - GITHUB_EVENT_PATH
              - GITHUB_ACTIONS
            tools:
              - uv
              - python
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-actionlint.py]
        tests:
          check-results:
            product-inputs: &android-product-inputs
              - project.godot
              - export_presets.cfg
              - main.tscn
              - assets/**
              - scripts/main.gd
              - scripts/audio_controller.gd
              - scripts/space_target.gd
              - scripts/player_ship.gd
              - scripts/planet.gd
              - scripts/traxy.gd
              - scripts/meteor.gd
              - scripts/godot_toolchain.py
              - scripts/build_board_module.py
              - addons/bobo_board/*.gd
              - addons/bobo_board/plugin.cfg
              - addons/bobo_board/native/*.kts
              - addons/bobo_board/native/*.properties
              - addons/bobo_board/native/gradlew*
              - addons/bobo_board/native/gradle/**
              - addons/bobo_board/native/board/build.gradle.kts
              - addons/bobo_board/native/godot/build.gradle.kts
              - addons/bobo_board/native/board/src/main/**
              - addons/bobo_board/native/godot/src/main/**
            check-inputs:
              - scripts/run-tests.py
              - scripts/regression_tests.gd
              - scripts/result_records.py
              - docs/feature-acceptance.json
              - sdlc/sdlc.yml
              - addons/bobo_board/native/board/src/test/**
            dependencies:
              - scripts/uv.lock
              - scripts/package-lock.json
            environment:
              - JAVA_HOME
              - ANDROID_HOME
              - ANDROID_SDK_ROOT
              - JAVA_TOOL_OPTIONS
              - GRADLE_OPTS
              - DISPLAY
              - LANG
              - LC_ALL
              - TZ
            tools:
              - python
              - git
              - java
              - adb
              - uv
          requires:
            tools:
              - uv
          steps:
            - run: [uv, run, --project, scripts, --locked, python, scripts/run-tests.py, --no-record, --scope, repository]
deliverables:
  packages:
    astrotops-android-apk:
      root-dir: .
      build-after: []
      artifact:
        type: android-apk
        output-directory: .build/artifacts/android
        filename-pattern: AstroTops.apk
      actions:
        build:
          requires:
            tools:
              - android-sdk
              - jdk
              - uv
          result-schema: ceratops-build-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/run-tests.py
                - --export-debug
                - .build/artifacts/android/AstroTops.apk
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/result_records.py
                - build-result
                - --artifact
                - .build/artifacts/android/AstroTops.apk
                - --type
                - android-apk
  apps:
    astrotops:
      root-dir: .
      manifest: export_presets.cfg
      build-after:
        - deliverables.packages.astrotops-android-apk
      actions:
        pre-build-checks:
          check-groups:
            source:
              check-results:
                product-inputs: *android-product-inputs
                check-inputs:
                  - scripts/run-tests.py
                  - scripts/result_records.py
                  - sdlc/sdlc.yml
                dependencies:
                  - scripts/uv.lock
                environment:
                  - JAVA_HOME
                  - ANDROID_HOME
                  - ANDROID_SDK_ROOT
                  - JAVA_TOOL_OPTIONS
                  - GRADLE_OPTS
                  - GODOT_EXECUTABLE
                  - ASTROTOPS_TOOL_CACHE
                  - ASTROTOPS_ANDROID_SOURCE_TEMPLATE
                tools:
                  - python
                  - git
                  - java
                  - adb
                  - uv
              requires:
                tools:
                  - android-sdk
                  - jdk
                  - uv
              validation-tools:
                - android-build
                - android-lint
              steps:
                - run: [uv, run, --project, scripts, --locked, scripts/run-tests.py, --validate-android-build]
            tests:
              requires:
                tools: []
              no-op: Repository tests own the grouped gameplay and rendered-app qualification.
        install:
          requires:
            tools:
              - adb
              - uv
          parameters:
            - adb_executable
            - device
          result-schema: ceratops-deployment-result.v1
          steps:
            - run:
                - uv
                - run
                - --project
                - scripts
                - --locked
                - scripts/result_records.py
                - android-deploy
                - --adb-executable
                - '{adb_executable}'
                - --device
                - '{device}'
                - --package
                - com.ceratopscode.astrotops
                - --activity
                - com.ceratopscode.astrotops/com.godot.game.GodotAppLauncher
                - --artifact
                - .build/artifacts/android/AstroTops.apk
                - --type
                - android-apk
